# SPA-friendly nginx config: any path that isn't a real static file falls
# back to index.html so React Router can handle client-side routes like
# /sales or /reports on a direct load/refresh, instead of nginx 404-ing.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets can be cached aggressively -- Vite fingerprints filenames
    # on every build, so a new deploy naturally busts the cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  dependency-review:
    name: Dependency scanning (Dependabot / dependency review)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  build-image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      dev-tag: ${{ steps.meta.outputs.dev_tag }}
      staging-tag: ${{ steps.meta.outputs.staging_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "tag=ghcr.io/theadonata/stock-frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "dev_tag=ghcr.io/theadonata/stock-frontend:dev" >> "$GITHUB_OUTPUT"
          echo "staging_tag=ghcr.io/theadonata/stock-frontend:staging" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t ${{ steps.meta.outputs.tag }} -t ${{ steps.meta.outputs.dev_tag }} -t ${{ steps.meta.outputs.staging_tag }} .

      - name: Save image as artifact
        run: docker save ${{ steps.meta.outputs.tag }} ${{ steps.meta.outputs.dev_tag }} ${{ steps.meta.outputs.staging_tag }} -o image.tar

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-image
          path: image.tar
          retention-days: 1

  trivy-scan:
    name: Container vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-image

      - name: Load image
        run: docker load -i image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build-image.outputs.image-tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

      - name: Run Trivy (SARIF for code scanning)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build-image.outputs.image-tag }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  push-image:
    name: Push image to ghcr.io
    runs-on: ubuntu-latest
    needs: [build-image, trivy-scan]
    if: github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-image

      - name: Load image
        run: docker load -i image.tar

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: |
          docker push ${{ needs.build-image.outputs.image-tag }}
          docker push ${{ needs.build-image.outputs.dev-tag }}
          docker push ${{ needs.build-image.outputs.staging-tag }}

  bump-dev:
    name: Bump dev image tag
    needs: push-image
    if: github.event_name == 'push'
    uses: theadonata/stock-infrastructure/.github/workflows/bump-values.yml@main
    with:
      environment: dev
      app_label: frontend
      image_tag: ${{ github.sha }}
      yq_paths: ".frontend.image.tag"
      auto_merge: true
    secrets:
      infra_repo_pat: ${{ secrets.INFRA_REPO_PAT }}

  bump-staging:
    name: Bump staging image tag
    needs: push-image
    if: github.event_name == 'push'
    uses: theadonata/stock-infrastructure/.github/workflows/bump-values.yml@main
    with:
      environment: staging
      app_label: frontend
      image_tag: ${{ github.sha }}
      yq_paths: ".frontend.image.tag"
      auto_merge: false
    secrets:
      infra_repo_pat: ${{ secrets.INFRA_REPO_PAT }}
